name: CI

# Ported from ODataKit's CI: TopoText and SimpleNotes on Apple's Foundation
# and Core Data (macOS, and iOS in a simulator), and on GNUstep with
# FreeCoreData, all against ODataKit (whose ODataSync TopoTextSync is a part
# of, and whose server SimpleNotes' is).
#
# pull_request fires for a PR against any branch, with the workflow from the
# PR's head; workflow_dispatch only offers "Run workflow" once this file is
# on the default branch.
on:
  push:
  pull_request:
  workflow_dispatch:

# A push and the PR for the same branch share one group: the later run
# supersedes the earlier (and macOS minutes bill at 10x on a private
# repository).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ODataKit, pinned to a commit: TopoTextSync builds against its ODataSync.
  ODATAKIT_REF: 6a381a9ced6c7937390c1cdce937f47c00798a71

jobs:
  ########################### macOS / Cocoa, iOS ###########################
  # Apple's Foundation and Core Data: what GNUstep and FreeCoreData port. A
  # test red here and green on GNUstep is wrong about Foundation.
  macos:
    name: macOS and iOS
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/ODataKit
          ref: ${{ env.ODATAKIT_REF }}
          path: ODataKit

      - name: Show toolchain
        run: xcodebuild -version

      # The Xcode projects are written by Scripts/xcodeproj.py: what is
      # committed must be what it writes.
      - name: The Xcode projects are up to date
        run: |
          python3 Scripts/xcodeproj.py
          git diff --exit-code -- '*.xcodeproj' '*.xcworkspace' \
            || { echo "::error::run Scripts/xcodeproj.py and commit what it writes"; exit 1; }

      # ODataKit's frameworks, by its own Xcode workspace, for macOS and for
      # the iOS simulator: what the make builds use.
      - name: Build ODataKit
        run: |
          make odatakit ODATAKIT=../ODataKit
          make odatakit-ios ODATAKIT=../ODataKit

      - name: Build the libraries
        run: make

      - name: Unit tests (against Apple's Foundation and CoreData)
        run: make test

      - name: Convergence, long
        run: TOPOTEXT_SEEDS=2000 xcrun xctest -XCTest TopoTextFuzzTests,TTTableTests/testCopiesEditedAtRandomConverge build/TopoTextTests.xctest

      - name: Build for iOS
        run: make ios

      # SimpleNotes' devices and server: its tests, and two devices syncing
      # through the server over HTTP.
      - name: SimpleNotes, its tests and two devices through its server
        run: make -C Examples/SimpleNotes check

      # The apps and the server, as Xcode builds them, from TopoText.xcworkspace
      # (ODataKit's project beside it).
      - name: Build the apps
        run: |
          for scheme in SimpleNotes simplenotes-server; do
            xcodebuild -workspace TopoText.xcworkspace -scheme "$scheme" -destination 'platform=macOS' \
              -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedData" build
          done
          xcodebuild -workspace TopoText.xcworkspace -scheme SimpleNotes-iOS -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" build

      # Each app driven from within (--self-test): a note chosen, text typed,
      # Bold, synced, and a second device that sees it.
      - name: The macOS app's self-test
        run: |
          products="$RUNNER_TEMP/DerivedData/Build/Products/Debug"
          Examples/SimpleNotes/Tests/self-test.sh "$products/simplenotes-server" "$products/SimpleNotes.app/Contents/MacOS/SimpleNotes"

      - name: The iOS app's self-test, in a simulator
        run: |
          Examples/SimpleNotes/Tests/ios-self-test.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug/simplenotes-server" \
            "$RUNNER_TEMP/DerivedData-iOS/Build/Products/Debug-iphonesimulator/SimpleNotes.app"

      # Packaged on every commit (as RDLKit's and XFormsKit's CI), so there is
      # always a build to try: unsigned, named for the commit, and kept two
      # weeks. Signed releases are release.yml's.
      - name: Package the apps
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/DerivedData/Build/Products/Debug/SimpleNotes.app" \
            "$RUNNER_TEMP/SimpleNotes-macOS-unsigned.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/DerivedData-iOS/Build/Products/Debug-iphonesimulator/SimpleNotes.app" \
            "$RUNNER_TEMP/SimpleNotes-iOS-Simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleNotes-macOS-${{ github.sha }}
          path: |
            ${{ runner.temp }}/SimpleNotes-macOS-unsigned.zip
            ${{ runner.temp }}/SimpleNotes-iOS-Simulator.zip
          retention-days: 14

  ########################### GNUstep / Linux ###########################
  # A patched stack built by gnustep-patches, FreeCoreData as the Core Data
  # underneath, ODataKit installed into it: as ODataKit's own CI.
  gnustep:
    name: Ubuntu (GNUstep, FreeCoreData, clang, gnustep-2.0)
    runs-on: ubuntu-latest
    # The stack build is the long pole; with the cache, minutes.
    timeout-minutes: 90
    env:
      SRC_PATH: ${{ github.workspace }}/source
      PREFIX: ${{ github.workspace }}/build
      SOURCES: ${{ github.workspace }}/dependencies
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      # Foundation for the libraries, gui and back for SimpleNotes and the
      # Eau theme it looks as with, tools-xctest for the suites.
      COMPONENTS: libobjc2 libdispatch tools-make libs-base libs-gui libs-back eau tools-xctest
      # libobjc2 and libdispatch land in the prefix's plain lib/, which the
      # gnustep layout does not treat as a library root.
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
      # gnustep-patches 4d5599f: NSExpression's FUNCTION and FETCH, and an
      # expression given for %@ taken as that expression, which FreeCoreData's
      # migrations need. FreeCoreData f3d56b4 (#62-67): momc reads Preserve
      # After Deletion and Renaming IDs as Xcode writes them; a store comes
      # through a migration as the same store, metadata and history (a
      # migrated device keeps its replica ID, and what it had not sent); an
      # inferred mapping follows Renaming IDs (SimpleNotes' updated, now
      # edited). gnustep-patches c03ea57 and FreeCoreData 5b83123 (#68):
      # fetch indexes, which the model and ODataSync's bookkeeping declare;
      # a nil constant in a predicate prints, and parses back, as nil.
      # gnustep-patches edc2289: a nil argument for %@ compares with nil;
      # 40a2bc8: keep-nib-textfield-bezel retired, merged into Eau's dev;
      # 4593e60: Eau built at a pinned commit of dev (01be00b); 239a625:
      # NSDictionary and NSArray read a binary property list from a file;
      # 1eda55d: six libs-base fixes retired, merged upstream; 6d99b7c:
      # more retired as libs-base merged them (its master is built).
      # FreeCoreData 591dfa6 (#69): a model's copy keeps exactly its indexes;
      # fd6ae53 (#70): -migratePersistentStore:, which moves a server's
      # notes to another store (MoveFrom); 338bc7b (#71): an object and its
      # context let go of what they held (the server's memory); eaf7072
      # (#72): a context that related objects is let go of; 5247095 (#73):
      # objects tell their context of their changes (no KVO), and a fetch
      # reads its rows at once rather than a fault at a time.
      GNUSTEP_PATCHES_REF: 6d99b7c1df7ad81191de9cd8d7805156f5d4eb91
      FREECOREDATA_REF: 524709592bf8670dab363d4c00d70eff4aa51e55
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source

    # SimpleNotes' server on real databases, through FreeCoreData's SQL
    # stores, as ODataKit's CI runs its own pair tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: notes
          POSTGRES_DB: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: notes
          MARIADB_DATABASE: notes
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/gnustep-patches
          ref: ${{ env.GNUSTEP_PATCHES_REF }}
          path: gnustep-patches

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/FreeCoreData
          ref: ${{ env.FREECOREDATA_REF }}
          path: FreeCoreData

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/ODataKit
          ref: ${{ env.ODATAKIT_REF }}
          path: ODataKit

      - name: Install packages
        run: |
          ./.github/scripts/apt-update.sh
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev zlib1g-dev libcurl4-gnutls-dev libgmp-dev libsqlite3-dev \
            libavahi-compat-libdnssd-dev libpthread-workqueue-dev libpq-dev libmariadb-dev \
            libcairo2-dev libjpeg-dev libtiff-dev libpng-dev libicns-dev \
            libfreetype-dev libfontconfig1-dev libxrender-dev \
            libxt-dev libxmu-dev libxft-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            xvfb fonts-dejavu-core fonts-dejavu-extra
          # The gnustep-2.0 runtime needs ld.gold or lld; ld.gold is gone
          # from binutils on newer Ubuntu.
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi
          ld --version | head -1

      # The recipe hash covers the build script, COMPONENTS, the toolchain and
      # every patch: it changes exactly when the prefix would.
      - name: GNUstep recipe
        id: recipe
        run: echo "hash=$(../gnustep-patches/Scripts/build-gnustep.sh --print-recipe-hash)" >> "$GITHUB_OUTPUT"

      # Restored and saved apart, so the save holds the stack before
      # FreeCoreData, ODataKit or TopoText is installed into it.
      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-${{ steps.recipe.outputs.hash }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ../gnustep-patches/Scripts/build-gnustep.sh

      - name: Save GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-${{ steps.recipe.outputs.hash }}

      - name: Verify GNUstep
        if: steps.gnustep-cache.outputs.cache-hit == 'true'
        run: ../gnustep-patches/Scripts/build-gnustep.sh --verify-only

      - name: Build and install FreeCoreData
        working-directory: ${{ github.workspace }}/FreeCoreData
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -j"$(nproc)"
          make install
          make -C Tools/momc
          make -C Tools/momc install
          for backend in PostgreSQL MySQL; do
            make -C Backends/$backend && make -C Backends/$backend install
          done

      - name: Build and install ODataKit
        working-directory: ${{ github.workspace }}/ODataKit
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -j"$(nproc)"
          make install

      # TopoText alone needs nothing but Foundation: kept so.
      - name: Build TopoText alone
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make WITH_SYNC=no
          make clean

      - name: Build and install the libraries
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -j"$(nproc)"
          make install
          test -f "$(gnustep-config --variable=GNUSTEP_LOCAL_HEADERS)/TopoText/TopoText.h"

      - name: Unit tests
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make test

      - name: Build SimpleNotes
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -C Examples/SimpleNotes -j"$(nproc)"

      # Its tests, two devices through its server over HTTP, and the app
      # driven from within (--self-test) under xvfb-run.
      - name: SimpleNotes, checked
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -C Examples/SimpleNotes check

      - name: SimpleNotes' server on PostgreSQL and MariaDB
        working-directory: ${{ github.workspace }}/source/Examples/SimpleNotes
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          SN_STORE_ARGS="-StoreType PostgreSQL -StoreURL postgresql://postgres:notes@127.0.0.1:5432/notes" \
            Tests/serve-and-check.sh ./obj/simplenotes-server ./SimpleNotes.app/SimpleNotes --check
          SN_STORE_ARGS="-StoreType MariaDB -StoreURL mysql://root:notes@127.0.0.1:3306/notes" SN_CHECK_PORT=18081 \
            Tests/serve-and-check.sh ./obj/simplenotes-server ./SimpleNotes.app/SimpleNotes --check

      # A server's notes moved from SQLite to PostgreSQL (MoveFrom), into a
      # database of their own.
      - name: SimpleNotes' server moved from SQLite to PostgreSQL
        working-directory: ${{ github.workspace }}/source/Examples/SimpleNotes
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c 'CREATE DATABASE moved'
          Tests/move-and-check.sh ./obj/simplenotes-server -StoreType PostgreSQL -StoreURL postgresql://postgres:notes@127.0.0.1:5432/moved

      # Packaged on every commit (as RDLKit's and XFormsKit's CI), so there is
      # always a build to try: named for the commit, kept two weeks. Built on
      # this job's Ubuntu, so it needs a glibc as new; release.yml's, built on
      # an older one, runs on more.
      - name: Fetch linuxdeploy and the AppImage runtime
        run: ./Scripts/install-linuxdeploy.sh

      - name: Package the AppImage
        env:
          APP_VERSION: 0.0.0-${{ github.run_number }}-${{ github.sha }}
        run: |
          sudo apt-get -q -y install file desktop-file-utils fonts-liberation
          ./Scripts/stamp-version.sh "$APP_VERSION"
          GNUSTEP_PREFIX="$PREFIX" ./Scripts/prepare-appdir.sh
          GNUSTEP_PREFIX="$PREFIX" ./Scripts/package-appimage.sh

      # As release.yml's: a plain Ubuntu (this job's) with no GNUstep, the
      # image's own server, and the app's self-test against it.
      - name: Smoke-test the AppImage on a clean system
        run: |
          image=$(ls SimpleNotes-*.AppImage)
          chmod +x "$image"
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive APPIMAGE_EXTRACT_AND_RUN=1
            for i in 1 2 3; do
              apt-get update -qq && apt-get install -y -qq --fix-missing xvfb xauth ca-certificates python3 \
                libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxcb1 libgl1 libharfbuzz0b > /dev/null && break
              sleep 10
            done
            rm -rf /usr/share/fonts
            ./'"$image"' --server -StoreURL Temporary -Port 18090 -AccessLog NO > /tmp/server.log 2>&1 &
            for i in $(seq 1 60); do python3 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:18090/odata/\")" 2>/dev/null && break; sleep 1; done
            python3 Examples/SimpleNotes/Tests/seed.py http://127.0.0.1:18090/odata/ || { cat /tmp/server.log; exit 1; }
            timeout 300 xvfb-run -a ./'"$image"' --self-test http://127.0.0.1:18090/odata/'

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleNotes-AppImage-${{ github.sha }}
          path: ${{ env.SRC_PATH }}/SimpleNotes-*.AppImage
          retention-days: 14
