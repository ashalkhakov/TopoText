name: Release

# SimpleNotes for macOS (signed, notarized, updated by Sparkle), iOS
# (unsigned) and Linux (an AppImage that updates itself), by
# gnustep-release-actions' release workflows, the same as every app's. What
# is SimpleNotes' own is in .github/release/ (build, test, package); the
# commits it builds on in .github/pins.env.
#
# A v* tag builds all three and attaches them to its release (a pre-release
# when the tag has a '-'). Run by hand with a tag, it builds that tag; with
# none, this branch, as artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and attach to its release (empty: this branch, artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: SimpleNotes=SimpleNotes
      dependencies: ODataKit
    secrets: inherit

  ios:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/ios-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: SimpleNotes-iOS=SimpleNotes
      dependencies: ODataKit

  appimage:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/appimage-release.yml@appimage-shared
    with:
      tag: ${{ inputs.tag }}
      dependencies: FreeCoreData ODataKit
      extra-packages: libsqlite3-dev libpq-dev libmariadb-dev
