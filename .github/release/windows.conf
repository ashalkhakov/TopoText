# SimpleNotes' Windows installer: what it carries and starts. The installer
# is gnustep-release-actions' msi (the runtime, WinUXTheme), the same as
# every app's; see its msi.sh for each name. The server is in the runtime
# beside it (simplenotes-server, its model next to it), started by hand.
NAME=SimpleNotes
APPS="SimpleNotes"
DEFAULT=SimpleNotes
ICON=Examples/SimpleNotes/Icons/SimpleNotes.png
SUMMARY="Notes that sync, and merge what was written apart"
# No self-test here: it needs a server. The installed app still up after
# 25 seconds, its nibs loaded.
SMOKE_STAYS_UP=25
