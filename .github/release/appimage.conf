# SimpleNotes' AppImage: what it carries and starts. The image is
# gnustep-release-actions' appimage (the launcher, the runtime, the fonts),
# the same as every app's; see its appimage.sh for each name.
IMAGE=SimpleNotes
NAME=SimpleNotes
APPS="SimpleNotes"
# The server is opt-in: nothing in the image serves unless asked so, and
# self-hosters with a machine of their own are better served by its Docker
# image. It is here for those without one (a small board, no containers).
TOOLS="simplenotes-server"
DEFAULT=SimpleNotes
#   <image> --server -StoreURL notes.sqlite -Port 8080
#   ln -s <image> simplenotes-server
ROUTES="server,--server,simplenotes-server=simplenotes-server app,simplenotes=SimpleNotes"
ENTRIES="Scripts/appimage/simplenotes.desktop=Examples/SimpleNotes/Icons/SimpleNotes.png"
METAINFO=Scripts/appimage/io.github.ashalkhakov.SimpleNotes.appdata.xml
# FreeCoreData's SQL stores, loaded by name (-StoreType PostgreSQL, MySQL).
LOADED="libCD*Store.so"
REQUIRE="SimpleNotes.app/Resources/MainMenu.xib simplenotes-server SimpleNotes.momd libCDPostgreSQLStore.so libCDMySQLStore.so"
# On a clean Ubuntu: the image's own server, and the app's self-test against it.
SMOKE_SCRIPT=Examples/SimpleNotes/Tests/appimage-smoke.sh
